<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IT Salary Calculator — India 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/tabler-icons.min.css" />
<style>
  :root{
    --bg:#0f0f0f;
    --surface:#1c1c1c;
    --surface-2:#262626;
    --surface-3:#2f2f2f;
    --border:#333;
    --text:#f5f5f5;
    --text-secondary:#a0a0a0;
    --text-tertiary:#7a7a7a;
    --blue-bg:#1e3a8a;
    --blue-fg:#93c5fd;
    --green-bg:#14532d;
    --green-fg:#86efac;
    --green-accent:#22c55e;
    --gray-bg:#3a3a3a;
    --gray-fg:#d4d4d4;
    --radius-md:8px;
    --radius-lg:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{padding:2rem 1.25rem;max-width:760px;margin:0 auto}
  label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:8px;margin-top:4px}
  select,button{
    width:100%;font-family:inherit;font-size:15px;color:var(--text);
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:14px 16px;margin-bottom:1.25rem;
    appearance:none;-webkit-appearance:none;cursor:pointer;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a0a0a0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 16px center;padding-right:42px;
  }
  select:focus,button:focus{outline:none;border-color:#555}
  button{background:transparent;border:1px solid var(--border);color:var(--text-secondary);transition:.15s}
  button:hover{background:var(--surface);color:var(--text)}

  .title{margin:0 0 4px;font-size:24px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
  .pill{font-size:12px;color:var(--text-secondary);background:var(--surface-2);padding:4px 10px;border-radius:99px;font-weight:500}
  .sub{font-size:14px;color:var(--text-secondary);margin:0 0 2rem}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-top:1.5rem;display:none}
  .role-title{font-size:18px;font-weight:600;color:var(--text);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .exp-tag{font-size:12px;color:var(--text-secondary);background:var(--surface-3);padding:3px 10px;border-radius:99px;font-weight:500}

  .sal-grid{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:1rem;gap:20px}
  .sal-lbl{font-size:11px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
  .sal-num{font-size:26px;font-weight:600;color:var(--text);margin:0 0 4px;line-height:1.1}
  .sal-sub{font-size:13px;color:var(--text-secondary);margin:0}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
  .stat{background:var(--surface-2);border-radius:var(--radius-md);padding:14px 16px}
  .stat-lbl{font-size:12px;color:var(--text-secondary);margin:0 0 6px}
  .stat-val{font-size:16px;font-weight:600;color:var(--text);margin:0}
  .demand-bar{height:6px;background:var(--surface-3);border-radius:99px;margin-top:10px;overflow:hidden}
  .demand-fill{height:100%;border-radius:99px;background:var(--green-accent);transition:width .4s}

  .sec-title{font-size:13px;color:var(--text);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:6px}
  .legend{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  .leg{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .skills-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
  .skill{font-size:13px;padding:5px 14px;border-radius:99px;font-weight:500;line-height:1.4}
  .skill.must{background:var(--blue-bg);color:var(--blue-fg)}
  .skill.good{background:var(--green-bg);color:var(--green-fg)}
  .skill.plus{background:var(--gray-bg);color:var(--gray-fg)}

  .note{font-size:12px;color:var(--text-tertiary);margin:14px 0 0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <p class="title">
    <i class="ti ti-briefcase" aria-hidden="true"></i>IT salary calculator
    <span class="pill">India · <span id="yr"></span></span>
  </p>
  <p class="sub">Select your role and experience to see salary in ₹</p>

  <label for="rs">Job role</label>
  <select id="rs">
    <option value="">— choose a role —</option>
    <option value="fullstack">Full Stack Developer</option>
    <option value="frontend">Frontend Developer</option>
    <option value="backend">Backend Developer</option>
    <option value="data_analyst">Data Analyst</option>
    <option value="data_scientist">Data Scientist</option>
    <option value="devops">DevOps Engineer</option>
    <option value="ui_designer">UI/UX Designer</option>
    <option value="web_dev">Web Developer</option>
    <option value="qa">QA / Test Engineer</option>
    <option value="ml_engineer">ML Engineer</option>
    <option value="cloud_engineer">Cloud Engineer</option>
    <option value="mobile_dev">Mobile App Developer</option>
    <option value="cybersecurity">Cybersecurity Analyst</option>
    <option value="product_manager">Product Manager</option>
    <option value="db_admin">Database Administrator</option>
  </select>

  <label for="es">Experience level</label>
  <select id="es">
    <option value="">— choose experience —</option>
    <option value="fresher">Fresher (0 years)</option>
    <option value="1">1 year</option>
    <option value="2">2 years</option>
    <option value="3">3 years</option>
    <option value="4">4 years</option>
    <option value="5">5+ years</option>
  </select>

  <button onclick="calc()"><i class="ti ti-calculator" aria-hidden="true"></i> Calculate salary</button>

  <div class="card" id="card">
    <p class="role-title" id="r-title"></p>

    <div class="sal-grid">
      <div>
        <p class="sal-lbl"><i class="ti ti-calendar"></i> Yearly (avg)</p>
        <p class="sal-num" id="yr-avg"></p>
        <p class="sal-sub" id="yr-range"></p>
      </div>
      <div>
        <p class="sal-lbl"><i class="ti ti-clock"></i> Monthly (avg)</p>
        <p class="sal-num" id="mo-avg"></p>
        <p class="sal-sub" id="mo-range"></p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <p class="stat-lbl">Market demand</p>
        <p class="stat-val" id="demand-lbl"></p>
        <div class="demand-bar"><div class="demand-fill" id="d-fill"></div></div>
      </div>
      <div class="stat">
        <p class="stat-lbl">Salary growth / yr</p>
        <p class="stat-val" id="growth-lbl"></p>
      </div>
    </div>

    <p class="sec-title"><i class="ti ti-tool"></i> Required skills</p>
    <div class="legend">
      <span class="leg"><span class="dot" style="background:#3b82f6"></span>Must have</span>
      <span class="leg"><span class="dot" style="background:#22c55e"></span>Good to have</span>
      <span class="leg"><span class="dot" style="background:#888"></span>Bonus</span>
    </div>
    <div class="skills-wrap" id="skills"></div>

    <p class="note" id="note"></p>
  </div>
</div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
const L = 100000;
const roles = {
  fullstack:{name:"Full Stack Developer",base:4.5*L,growth:1.8*L,demand:92,demandLabel:"Very High",growthPct:"18–22%",must:["HTML","CSS","JavaScript","React","Node.js","SQL","Git","REST APIs"],good:["TypeScript","Docker","MongoDB","Redis","CI/CD","AWS/GCP"],bonus:["GraphQL","Kubernetes","System Design","Microservices"]},
  frontend:{name:"Frontend Developer",base:3.8*L,growth:1.5*L,demand:85,demandLabel:"High",growthPct:"15–20%",must:["HTML5","CSS3","JavaScript (ES6+)","React","Git","Figma","Responsive Design"],good:["TypeScript","Next.js","Tailwind CSS","Jest","Webpack/Vite","Deployment (Vercel/Netlify)"],bonus:["Vue.js","Angular","GraphQL","Performance Optimization","Accessibility (a11y)"]},
  backend:{name:"Backend Developer",base:4.2*L,growth:1.7*L,demand:88,demandLabel:"High",growthPct:"16–21%",must:["Python / Java / Node.js","REST APIs","SQL","Git","Linux Basics","Authentication (JWT/OAuth)"],good:["Docker","PostgreSQL","MongoDB","Redis","Message Queues (Kafka/RabbitMQ)","Microservices"],bonus:["Kubernetes","gRPC","System Design","Cloud (AWS/GCP/Azure)"]},
  data_analyst:{name:"Data Analyst",base:3.5*L,growth:1.3*L,demand:80,demandLabel:"High",growthPct:"14–18%",must:["SQL","Excel","Python (Pandas/NumPy)","Power BI / Tableau","Statistics","Data Cleaning"],good:["Python (Matplotlib/Seaborn)","Google Analytics","ETL Basics","Storytelling with Data"],bonus:["R","Looker","BigQuery","Machine Learning basics","Dashboard Automation"]},
  data_scientist:{name:"Data Scientist",base:6*L,growth:2.2*L,demand:90,demandLabel:"Very High",growthPct:"20–25%",must:["Python","Statistics & Probability","Machine Learning","SQL","Pandas / NumPy","Scikit-learn"],good:["TensorFlow / PyTorch","Feature Engineering","Model Deployment","Spark","A/B Testing"],bonus:["Deep Learning","NLP","Computer Vision","MLflow","Cloud ML (SageMaker/Vertex AI)"]},
  devops:{name:"DevOps Engineer",base:5.5*L,growth:2*L,demand:87,demandLabel:"High",growthPct:"18–23%",must:["Linux","Docker","Git","CI/CD (Jenkins/GitHub Actions)","Shell Scripting","Networking Basics"],good:["Kubernetes","Terraform","AWS/Azure/GCP","Ansible","Monitoring (Prometheus/Grafana)"],bonus:["Service Mesh (Istio)","ArgoCD","FinOps","Security (DevSecOps)"]},
  ui_designer:{name:"UI/UX Designer",base:3.2*L,growth:1.1*L,demand:72,demandLabel:"Medium",growthPct:"12–16%",must:["Figma","Adobe XD","Wireframing","Prototyping","User Research","Visual Design Principles"],good:["Sketch","HTML/CSS Basics","Usability Testing","Design Systems","Motion Design"],bonus:["Framer","Webflow","Accessibility Design","No-code Tools","Branding"]},
  web_dev:{name:"Web Developer",base:3*L,growth:1*L,demand:78,demandLabel:"High",growthPct:"12–16%",must:["HTML","CSS","JavaScript","WordPress / CMS","Git","FTP / Deployment","Responsive Design"],good:["PHP","MySQL","React basics","SEO Basics","cPanel / Hosting"],bonus:["Elementor / Gutenberg","E-commerce (WooCommerce)","Performance Optimization"]},
  qa:{name:"QA / Test Engineer",base:3.2*L,growth:1*L,demand:70,demandLabel:"Medium",growthPct:"10–14%",must:["Manual Testing","Test Case Writing","JIRA","Bug Tracking","SQL Basics","Selenium"],good:["Python / Java for Automation","Postman (API Testing)","TestNG / JUnit","CI/CD basics"],bonus:["Performance Testing (JMeter)","Cypress","Mobile Testing","ISTQB Certification"]},
  ml_engineer:{name:"ML Engineer",base:7*L,growth:2.5*L,demand:93,demandLabel:"Very High",growthPct:"22–28%",must:["Python","ML Algorithms","TensorFlow / PyTorch","SQL","Data Preprocessing","Git"],good:["MLOps","Docker","Cloud ML (AWS SageMaker)","Feature Stores","Model Monitoring"],bonus:["LLMs / Transformers","Spark","CUDA / GPU Programming","Kubeflow"]},
  cloud_engineer:{name:"Cloud Engineer",base:5.8*L,growth:2.1*L,demand:89,demandLabel:"Very High",growthPct:"20–25%",must:["AWS / Azure / GCP","Linux","Networking","Terraform","Docker","IAM & Security"],good:["Kubernetes","CI/CD","Python / Bash scripting","Cost Optimization","Serverless"],bonus:["Multi-cloud Architecture","FinOps","Compliance (SOC2/ISO)","Service Mesh"]},
  mobile_dev:{name:"Mobile App Developer",base:4*L,growth:1.5*L,demand:82,demandLabel:"High",growthPct:"15–20%",must:["React Native / Flutter","JavaScript / Dart","REST APIs","Git","App Store Deployment"],good:["Native iOS (Swift) / Android (Kotlin)","Push Notifications","Firebase","State Management"],bonus:["AR/VR","BLE / IoT Integration","Performance Profiling","In-app Purchases"]},
  cybersecurity:{name:"Cybersecurity Analyst",base:5*L,growth:1.9*L,demand:88,demandLabel:"High",growthPct:"18–24%",must:["Networking (TCP/IP)","Linux","Firewalls & IDS/IPS","SIEM Tools","Vulnerability Assessment","Python basics"],good:["Penetration Testing","OWASP","Incident Response","Compliance (ISO 27001)","Cloud Security"],bonus:["Ethical Hacking","Forensics","Red Team / Blue Team","CEH / CISSP Certification"]},
  product_manager:{name:"Product Manager",base:6.5*L,growth:2.3*L,demand:80,demandLabel:"High",growthPct:"18–22%",must:["Product Roadmapping","Agile / Scrum","JIRA / Confluence","Stakeholder Management","User Research","Data Analysis"],good:["SQL","Figma basics","A/B Testing","OKR Frameworks","Go-to-market Strategy"],bonus:["Technical Background","Growth Hacking","PRDs","Customer Journey Mapping"]},
  db_admin:{name:"Database Administrator",base:4*L,growth:1.2*L,demand:68,demandLabel:"Medium",growthPct:"10–14%",must:["SQL (PostgreSQL / MySQL / Oracle)","Backup & Recovery","Query Optimization","Indexing","Linux","Data Modeling"],good:["MongoDB","Redis","Replication & Sharding","Performance Tuning","Scripting (Python/Bash)"],bonus:["Cloud Databases (RDS/Aurora)","Database Security","Big Data (Hadoop)"]}
};
const expMul={fresher:0,"1":1,"2":2.2,"3":3.5,"4":5,"5":7};
const expLbl={fresher:"Fresher","1":"1 year","2":"2 years","3":"3 years","4":"4 years","5":"5+ years"};
const inr=n=>"₹"+Math.round(n).toLocaleString('en-IN');
const lakhStr=n=>"₹"+(Math.round((n/100000)*10)/10).toFixed(1)+" L";
function calc(){
  const rk=document.getElementById('rs').value;
  const ek=document.getElementById('es').value;
  if(!rk||!ek){alert("Please select both a role and experience level.");return}
  const r=roles[rk],mul=expMul[ek];
  const avg=r.base+r.growth*mul,lo=avg*0.85,hi=avg*1.18;
  const moAvg=avg/12,moLo=lo/12,moHi=hi/12;
  document.getElementById('r-title').innerHTML=r.name+' <span class="exp-tag">'+expLbl[ek]+'</span>';
  document.getElementById('yr-avg').textContent=lakhStr(avg)+" / year";
  document.getElementById('yr-range').textContent=lakhStr(lo)+" – "+lakhStr(hi)+" range";
  document.getElementById('mo-avg').textContent=inr(moAvg)+" / mo";
  document.getElementById('mo-range').textContent=inr(moLo)+" – "+inr(moHi)+" range";
  document.getElementById('demand-lbl').textContent=r.demandLabel;
  const fill=document.getElementById('d-fill');
  fill.style.width=r.demand+"%";
  fill.style.background=r.demand>=85?"#22c55e":r.demand>=75?"#eab308":"#888";
  document.getElementById('growth-lbl').textContent=r.growthPct+" per year";
  const sw=document.getElementById('skills');
  sw.innerHTML=r.must.map(s=>'<span class="skill must">'+s+'</span>').join('')+
               r.good.map(s=>'<span class="skill good">'+s+'</span>').join('')+
               r.bonus.map(s=>'<span class="skill plus">'+s+'</span>').join('');
  const yr=new Date().getFullYear();
  document.getElementById('note').textContent="Estimates based on "+yr+" India IT market data. Salaries vary by city (Bengaluru/Hyderabad/Pune pay 15–25% higher), company size, and skillset. Figures are CTC (cost to company).";
  const card=document.getElementById('card');
  card.style.display="block";
  card.scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script>
</body>
</html>
